<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- [2026.09.19] 수정: 화면의 서비스 이름을 ALLEYES로 통일합니다. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLEYES · 설정</title>
  <!-- [2026.09.29 변경] 설정 화면의 넓은 데스크톱 여백 보정 CSS를 최신 버전으로 불러옵니다. -->
  <link rel="stylesheet" href="../../../static/css/settings/settings.css?v=wide-settings-page-20260929" th:href="@{/css/settings/settings.css(v='wide-settings-page-20260929')}">
  <!-- [수정완료] 카드 잘림을 방지하고 메모 입력 영역을 구성합니다. -->
  <link rel="stylesheet" href="../../../static/css/settings/layout.css" th:href="@{/css/settings/layout.css}">
    <!-- [2026.09.19] 추가: ALLEYES 로고와 서비스 이름의 공통 정렬 스타일입니다. -->
    <link rel="stylesheet" href="../../../static/css/alleyes-brand.css?v=record-label-20260920" th:href="@{/css/alleyes-brand.css(v='record-label-20260920')}">
    <!-- [2026.09.19] 공통 블루 그레이 테마를 마지막에 적용합니다. -->
    <link rel="stylesheet" href="../../../static/css/alleyes-theme.css?v=topbar-font-up-20261001" th:href="@{/css/alleyes-theme.css(v='topbar-font-up-20261001')}">
</head>
<body>
  <!-- [수정완료] 참고 이미지처럼 프로필과 설정 정보를 분리한 화면으로 구성합니다. -->
  <header class="settings-header">
    <a class="back-link" href="../dashboard/dashboard.html" th:href="@{/dashboard}" style="display:inline-flex;align-items:center;gap:6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span>대시보드로 돌아가기</span>
    </a>
    <strong class="alleyes-brand"><img class="alleyes-logo" src="../../../static/image/brand/alleyes-logo-blue-peach-gradient.svg" th:src="@{/image/brand/alleyes-logo-blue-peach-gradient.svg}" alt="" width="44" height="42">ALLEYES</strong>
  </header>

  <main class="settings-page">
    <div class="settings-heading">
      <p class="eyebrow">환경 설정</p>
      <h1>설정</h1>
      <p class="description">계정 정보를 확인하고 보안을 관리하세요.</p>
    </div>

    <div class="settings-layout">
      <!-- [수정완료] 로그인 사용자 정보를 왼쪽 프로필 카드로 배치합니다. -->
      <aside class="profile-card">
        <!-- [수정완료] 원형 프로필, 이름과 직무, 구분선, 안내 문구 순서로 구성합니다. -->
        <!-- [수정완료] 원형 프로필 안에 기존 초록색을 사용하는 사람 아이콘을 표시합니다. -->
        <div class="profile-card-avatar" aria-hidden="true">
          <svg width="56%" height="56%" viewBox="0 0 64 64" fill="currentColor" focusable="false">
            <circle cx="32" cy="20" r="11" />
            <path d="M12 54v-4a20 16 0 0 1 40 0v4a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3Z" />
          </svg>
        </div>
        <h2><span th:text="${displayName != null ? displayName : (session.userDisplayName != null ? session.userDisplayName : '이름 미입력')}">이름</span> 간호사</h2>
        <div class="profile-quote">“ 안전한 병동, 함께 만들어갑니다. ”</div>
      </aside>

      <div class="settings-content">
        <section class="settings-card basic-card" aria-labelledby="profile-title">
          <div class="card-heading"><span class="card-icon">▣</span><div><h2 id="profile-title">기본정보</h2><p>현재 로그인한 계정의 정보입니다.</p></div></div>
          <div class="basic-grid">
            <!-- [수정완료] 입력한 표시 이름을 읽기 전용으로 제공합니다. -->
            <div><span>이름</span><strong th:text="${displayName != null ? displayName : (session.userDisplayName != null ? session.userDisplayName : '이름 미입력')}">이름</strong></div>
            <!-- [수정완료] 로그인 세션의 아이디를 기본 정보 카드에 표시합니다. -->
            <div><span>아이디</span><strong th:text="${#authentication != null ? #authentication.name : userId}">user01</strong></div>
            <div><span>계정 상태</span><strong class="status-text">● 활성화</strong></div>
          </div>
        </section>

        <section class="settings-card password-row" aria-labelledby="password-title">
          <div class="card-heading"><span class="card-icon">▣</span><div><h2 id="password-title">비밀번호 변경</h2><p>계정 보안을 위해 주기적으로 비밀번호를 변경해주세요.</p></div></div>
          <!-- [수정완료] 비밀번호 변경 화면으로 이동하는 버튼을 배치합니다. -->
          <a class="settings-action" href="password-change.html" th:href="@{/user/password}">비밀번호 변경　›</a>
        </section>

        <!-- [수정완료] 계정 관리 영역에 마지막 로그인 시간, 상태, 로그아웃을 배치합니다. -->
        <section class="settings-card account-card" aria-labelledby="account-title">
          <div class="card-heading"><span class="card-icon">⚙</span><div><h2 id="account-title">계정 관리</h2><p>계정 사용 현황을 확인하고 안전하게 로그아웃할 수 있습니다.</p></div></div>
          <div class="account-row">
            <!-- [수정완료] 한국 시간 기준으로 실제 로그인 성공 날짜와 시각을 표시합니다. -->
            <div><span>마지막 로그인 시간</span><strong th:text="${session.userLoginTime != null ? session.userLoginTime : '로그인 시간 기록 없음'}">로그인 시간 기록 없음</strong><small>한국 시간 (KST)</small></div>
            <div><span>계정 상태</span><strong class="status-text">● 활성화</strong></div>
            <form action="auth/index.html" th:action="@{/logout}" method="post"><button class="logout-action" type="submit">↪ 로그아웃</button></form>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
