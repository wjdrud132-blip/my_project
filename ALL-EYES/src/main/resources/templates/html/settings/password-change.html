<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>비밀번호 변경 | 환자낙상예방</title>
  <!-- [2026.09.17] 추가한 내용: 대시보드 팝업 안에서 열 때만 전용 배치를 적용합니다. -->
  <script>
    if (window.parent !== window && window.frameElement?.id === 'password-change-frame') {
      document.documentElement.classList.add('password-popup');
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') window.parent.postMessage({type:'careguard-password-close'}, window.location.origin);
      });
    }
  </script>
  <!-- [2026.09.20] 초기 비밀번호 변경 화면에도 공통 로고를 표시합니다. -->
  <link rel="stylesheet" href="../../../static/css/alleyes-brand.css?v=record-label-20260920" th:href="@{/css/alleyes-brand.css(v='record-label-20260920')}">
  <!-- 비밀번호 변경 전용 스타일 -->
  <link rel="stylesheet" href="../../../static/css/settings/password-change.css?v=20261001-input-focus-border" th:href="@{/css/settings/password-change.css(v='20261001-input-focus-border')}">
    <!-- [2026.09.19] 공통 블루 그레이 테마를 마지막에 적용합니다. -->
    <link rel="stylesheet" href="../../../static/css/alleyes-theme.css?v=topbar-font-up-20261001" th:href="@{/css/alleyes-theme.css(v='topbar-font-up-20261001')}">
</head>
<body class="change-body" th:with="passwordLabel=${initialPasswordChange == true ? '초기 비밀번호' : '현재 비밀번호'}">
  <main class="change-page">
    <section class="change-content" aria-labelledby="change-title">
      <header class="change-header">
        <p class="change-eyebrow alleyes-brand change-brand"><img class="alleyes-logo" src="../../../static/image/brand/alleyes-logo-blue-peach-gradient.svg" th:src="@{/image/brand/alleyes-logo-blue-peach-gradient.svg}" alt="" width="44" height="42">ALLEYES</p>
        <h1 id="change-title">비밀번호 변경</h1>
        <p class="change-guide" th:text="${passwordLabel + '를 확인한 후 새 비밀번호를 저장합니다.'}">현재 비밀번호를 확인한 후 새 비밀번호를 저장합니다.</p>
      </header>

      <section class="change-card" aria-labelledby="change-form-title">
        <h2 id="change-form-title">새 비밀번호 설정</h2>

        <!-- 사용자 조회 자체가 실패한 경우 Controller가 userError를 Model에 넣는다. -->
        <div class="change-status is-error" th:if="${userError}" th:text="${userError}" role="alert"></div>

        <!--
          th:object는 Model의 passwordChangeForm DTO를 이 form의 기준 객체로 지정한다.
          th:action은 Context Path가 있더라도 올바른 POST URL을 만들어 준다.
          Thymeleaf와 Spring Security가 함께 동작하면 CSRF 토큰 hidden input이 자동 추가된다.
          novalidate는 브라우저 기본 메시지 대신 서버 Bean Validation 메시지를 일관되게 보여주기 위함이다.
        -->
        <form class="change-form" th:action="@{/user/password}" th:object="${passwordChangeForm}" method="post" novalidate>
          <div class="change-field">
            <label for="currentPassword" th:text="${passwordLabel}">현재 비밀번호</label>
            <!-- th:field="*{currentPassword}"는 DTO의 currentPassword 필드와 양방향 연결한다. -->
            <div class="initial-password-row">
            <div class="password-input-wrap">
              <input id="currentPassword" th:field="*{currentPassword}" type="password"
                     name="currentPassword" aria-describedby="initial-password-result" autocomplete="current-password" placeholder="현재 비밀번호를 입력해 주세요." th:placeholder="${passwordLabel + '를 입력해 주세요.'}" required>
              <button class="password-toggle" type="button" aria-label="현재 비밀번호 표시" th:attr="aria-label=${passwordLabel + ' 표시'}"
                      aria-controls="currentPassword" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>
              <button id="verify-initial-password" class="password-verify" type="button"
                      data-verify-url="/user/password/verify" th:data-verify-url="@{/user/password/verify}">비밀번호 확인</button>
            </div>
            <p id="initial-password-result" class="initial-password-result" role="status" aria-live="polite" hidden></p>
            <!-- 해당 필드에 검증 오류가 있을 때만 <p>를 만들고 오류 메시지를 출력한다. -->
            <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}"
               th:errors="*{currentPassword}" role="alert"></p>
          </div>
          <div class="change-field">
            <label for="newPassword">새 비밀번호</label>
            <div class="password-input-wrap">
              <input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password"
                     minlength="8" maxlength="32" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                     placeholder="영문, 숫자 포함 8자 이상" aria-describedby="password-rules" required>
              <button class="password-toggle" type="button" aria-label="새 비밀번호 표시"
                      aria-controls="newPassword" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>
            <div id="password-rules" class="password-feedback">
              <span id="rule-letter" class="validation-item">영문 포함</span>
              <span id="rule-number" class="validation-item">숫자 포함</span>
              <span id="rule-length" class="validation-item">8자 이상</span>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('newPassword')}"
               th:errors="*{newPassword}" role="alert"></p>
            <!-- DTO의 isPasswordByteLengthValid()가 false일 때 표시되는 객체 검증 오류다. -->
            <p class="field-error" th:if="${#fields.hasErrors('passwordByteLengthValid')}"
               th:errors="*{passwordByteLengthValid}" role="alert"></p>
          </div>
          <div class="change-field">
            <label for="passwordConfirm">새 비밀번호 확인</label>
            <div class="password-input-wrap">
              <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password"
                     autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력해 주세요."
                     aria-describedby="password-match" required>
              <button class="password-toggle" type="button" aria-label="새 비밀번호 확인 표시"
                      aria-controls="passwordConfirm" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>
            <div class="password-feedback" aria-live="polite">
              <span id="password-match" class="validation-item">새 비밀번호와 일치하는지 확인해 주세요.</span>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}"
               th:errors="*{passwordConfirm}" role="alert"></p>
            <!-- DTO의 isPasswordMatching()이 두 PW 입력값을 비교한다. -->
            <p class="field-error" th:if="${#fields.hasErrors('passwordMatching')}"
               th:errors="*{passwordMatching}" role="alert"></p>
          </div>
          <button class="change-submit" type="submit">비밀번호 변경하기</button>
        </form>
        <p class="change-login" th:if="${initialPasswordChange == false}">
          <a href="../dashboard/dashboard.html" th:href="@{/dashboard}">대시보드로 돌아가기</a>
        </p>
      </section>
    </section>
  </main>
  <!-- 서버에서 비밀번호 변경이 성공한 경우에만 팝업을 표시한다. -->
  <script th:if="${passwordChanged == true}" th:inline="javascript">
    const passwordChanged = /*[[${passwordChanged == true}]]*/ false;
    if (passwordChanged) {
      // [2026-09-18] 변경 화면이 먼저 그려진 후 완료 안내를 띄워 흰 화면이 배경으로 보이지 않게 한다.
      window.addEventListener('load', () => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (document.documentElement.classList.contains('password-popup')) {
            window.parent.postMessage({type:'careguard-password-changed'}, window.location.origin);
          } else {
            window.alert("비밀번호 변경이 완료되었습니다");
            window.location.replace(/*[[@{/dashboard}]]*/ "../dashboard/dashboard.html");
          }
        }));
      }, {once: true});
    }
  </script>
  <script th:src="@{/JS/settings/password-change.js}"
          src="../../../static/JS/settings/password-change.js"></script>
</body>
</html>
