spring.application.name=hospital-safety
spring.config.import=optional:file:./application-local.properties
server.port=8081
server.servlet.session.tracking-modes=cookie

# PostgreSQL
# DB_URL은 호스트명, DB_JDBC_URL은 전체 JDBC URL 재정의용이다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.aio.hospitalsafety.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 젯슨 엣지 장비 인증 (/api/edge/**)
# 키는 코드에 넣지 않는다. 환경변수 또는 application-local.properties 로 준다.
# 비어 있으면 모든 젯슨 요청을 401로 거절한다.
edge.api-key=${EDGE_API_KEY:}

# 개발 서버(DevTools)가 코드 변경으로 다시 켜질 때 로그인 세션을 파일로 되살리지 않는다.
# 되살리면 화면은 로그인 상태인데 로그인 명부(SessionRegistry)는 비어 있어, 실시간 알림 구독만 거절된다.
server.servlet.session.persistent=false

# SOLAPI 문자 발송 (확정 낙상 SMS). 코드에 넣지 않고 환경변수로 준다.
# 셋 중 하나라도 비어 있으면 보내지 않고 실패로 기록한다.
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
# SOLAPI 에 미리 등록한 발신번호 (숫자만)
solapi.sender-number=${SOLAPI_SENDER_NUMBER:}
# [2026.09.28] 문자 시험 모드: true 이면 SOLAPI 를 부르지 않고 보낼 문자(받는 사람 구분·번호 끝 4자리·내용)를 로그로만 남긴다.
solapi.dry-run=${SOLAPI_DRY_RUN:false}
# [2026.09.29] 중복·과다 발송 방지
# 같은 위치(병동+병실)에서 이 시간(초) 안에 이미 문자를 보냈으면 새 낙상이어도 다시 보내지 않는다(0 이면 끔).
solapi.location-cooldown-seconds=${SOLAPI_LOCATION_COOLDOWN_SECONDS:60}
# 서버를 한 번 켠 동안 보낼 수 있는 문자 최대 개수(0 이면 제한 없음). SOLAPI 사용량을 지키려는 시험용.
solapi.max-sends=${SOLAPI_MAX_SENDS:0}
# 받는 번호 끝 4자리 허용 목록(쉼표로 구분, 비우면 모두 허용). 시험 때 정해 둔 사람에게만 보내려는 용도.
solapi.allowed-last4=${SOLAPI_ALLOWED_LAST4:}

# 대시보드 실시간 알림(/ws)을 허락할 브라우저 주소. 쉼표로 여러 개. 비우면 같은 사이트만 허락한다.
# 배포 서버처럼 Apache 가 https 를 받아 넘기는 경우 예: WS_ALLOWED_ORIGINS=https://allinone.xos.kr
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:}

# [2026.09.28] 젯슨 낙상 영상 업로드(POST /api/edge/events/{eventId}/media). 20초 8Hz MJPG 한 개라 50MB 면 충분하다. 넘으면 413.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# 한도를 넘은 파일도 서버가 끝까지 받아 버린 뒤 413 을 돌려주게 한다. 기본값(2MB)이면 413 을 보내고 연결을 끊어서
# 젯슨은 413 대신 연결 오류를 받고 같은 파일을 계속 다시 올린다(시험: 51MB 를 천천히 보내면 연결 끊김). 200MB 가 넘으면 그때는 끊는다.
server.tomcat.max-swallow-size=200MB
# 영상 파일을 두는 폴더. 소스 폴더·target 밖이어야 개발 서버가 파일 변화로 재시작하지 않는다. 환경변수 EVENT_MEDIA_DIR 로 바꾼다.
event-media.storage-dir=${EVENT_MEDIA_DIR:${user.home}/alleyes-event-media}

